# Docker 없이 도는 빠른 테스트용 프로파일: H2(MySQL 모드). Redis 는 끈다.
spring:
  datasource:
    url: jdbc:h2:mem:lab;MODE=MySQL;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
    username: sa
    password:
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: 30

app:
  redis:
    enabled: false
  kafka:
    enabled: false
  optimistic:
    max-retries: 50
